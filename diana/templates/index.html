<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03070c" />
  <title>DIANA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%233ee3ff' stroke-width='2' stroke-dasharray='5 3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%233ee3ff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body data-state="idle">
  <!-- Icon sprite: one inline SVG instead of an icon font -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" /></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-2.5-6.5z" /><path d="m11.5 13.5 3-3" /></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="m17 9 5 6m0-6-5 6" /></symbol>
      <symbol id="i-headset" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3" /><rect x="3" y="14" width="4" height="6" rx="1.5" /><rect x="17" y="14" width="4" height="6" rx="1.5" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" /></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16" /></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" /><path d="M14 3v4h4M9 12h6M9 16h6" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V4H4v12h4" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M4 20h16" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" /><path d="m13 7 4 4" /></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="core core-mini" aria-hidden="true"><span class="nucleus"></span></div>
        <div>
          <h1 class="wordmark">DIANA</h1>
          <p class="subline"><span class="dot"></span><span id="status-text">Online</span></p>
        </div>
      </div>
      <div class="top-actions">
        <button id="voice-toggle" class="icon-btn" aria-pressed="true" title="Voice replies on/off">
          <svg><use href="#i-speaker" /></svg>
        </button>
        <button id="handsfree-toggle" class="icon-btn" aria-pressed="false" title="Hands-free: listen again after each reply">
          <svg><use href="#i-headset" /></svg>
        </button>
        <button id="clear-btn" class="icon-btn" title="New session">
          <svg><use href="#i-trash" /></svg>
        </button>
      </div>
    </header>

    <aside class="hud panel">
      <div class="core" id="core" aria-hidden="true">
        <svg class="ring r1" viewBox="0 0 120 120"><circle cx="60" cy="60" r="57" stroke-dasharray="3 7" /></svg>
        <svg class="ring r2" viewBox="0 0 120 120"><circle cx="60" cy="60" r="47" stroke-dasharray="70 18 12 18" /></svg>
        <svg class="ring r3" viewBox="0 0 120 120"><circle cx="60" cy="60" r="37" stroke-dasharray="1.5 4.5" /></svg>
        <span class="nucleus"></span>
      </div>
      <p class="hud-state" id="hud-state">STANDBY</p>

      <dl class="telemetry">
        <div><dt>Core</dt><dd>{{ model }}</dd></div>
        <div><dt>Latency</dt><dd id="t-latency">—</dd></div>
        <div><dt>Last ops</dt><dd id="t-ops">—</dd></div>
      </dl>

      <section class="doc-shelf">
        <h2>Documents</h2>
        <ul id="doc-list">
          <li class="empty">None generated yet</li>
        </ul>
      </section>
    </aside>

    <main class="console panel">
      <div id="chat-log" class="chat-log" aria-live="polite">
        <div class="welcome" id="welcome">
          <p class="welcome-title">Systems online.</p>
          <p>Speak or type. I can search the web, run calculations and draft documents you can preview and download.</p>
          <div class="suggestions">
            <button type="button" class="chip" data-prompt="What's the latest news in technology today?">Latest tech news</button>
            <button type="button" class="chip" data-mode="document" data-prompt="Write a leave application to my manager for 2 days due to a medical reason">Draft a leave application</button>
            <button type="button" class="chip" data-prompt="What is 18% of 2,450 plus 375?">Quick calculation</button>
          </div>
        </div>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <div class="mode-switch" role="radiogroup" aria-label="Output">
          <button type="button" class="mode" data-mode="chat" role="radio" aria-checked="true">Chat</button>
          <button type="button" class="mode" data-mode="document" role="radio" aria-checked="false">
            <svg><use href="#i-doc" /></svg>Document
          </button>
          <span class="mode-hint" id="mode-hint">Replies in chat · documents when useful</span>
        </div>
        <div class="input-row">
          <button type="button" id="attach-btn" class="icon-btn" title="Transcribe an audio file">
            <svg><use href="#i-upload" /></svg>
          </button>
          <input type="file" id="audio-file" accept="audio/*,video/webm" hidden />
          <textarea id="text-input" rows="1" placeholder="Type or speak a command…" aria-label="Message"></textarea>
          <button type="button" id="mic-btn" class="icon-btn mic" title="Speak (auto-stops on silence)">
            <svg><use href="#i-mic" /></svg>
          </button>
          <button type="submit" id="send-btn" class="icon-btn send" title="Send">
            <svg><use href="#i-send" /></svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <dialog id="doc-dialog" class="doc-dialog">
    <header class="dialog-head">
      <input id="doc-title" class="doc-title" aria-label="Document title" />
      <div class="dialog-actions">
        <button type="button" id="doc-edit" class="chip"><svg><use href="#i-edit" /></svg><span>Edit</span></button>
        <button type="button" class="chip" data-export="docx"><svg><use href="#i-download" /></svg>DOCX</button>
        <button type="button" class="chip" data-export="pdf"><svg><use href="#i-download" /></svg>PDF</button>
        <button type="button" class="chip" data-export="md"><svg><use href="#i-download" /></svg>MD</button>
        <button type="button" id="doc-close" class="icon-btn" aria-label="Close"><svg><use href="#i-close" /></svg></button>
      </div>
    </header>
    <div class="dialog-body">
      <article id="doc-preview" class="paper md"></article>
      <textarea id="doc-editor" class="doc-editor" spellcheck="true" hidden></textarea>
    </div>
  </dialog>

  <script src="{{ url_for('static', filename='js/voice.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>

</html>
